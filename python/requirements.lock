# Exact versions the tool is known to work against.
#
# `pyproject.toml` says what it depends on; this says what it was last run with.
# Without it a fresh `wire` resolves whatever is newest that day, so two
# machines set up a week apart run different code and a break that arrives with
# a dependency is indistinguishable from one that arrives with a commit.
#
# Regenerate deliberately, never as a side effect of installing:
#
#     ./python/scripts/sortyourpaperya-path relock
#
# Versions only, not hashes: this pins what is installed, and does not attempt
# to prove the package index handed over the same bytes it did last time.
