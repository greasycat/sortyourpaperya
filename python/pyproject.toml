[project]
name = "sortyourpaperya"
version = "0.1.0"
description = "The sortyourpaperya ingest pipeline and folder watcher."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "openai>=1.60.0",
  "pypdf>=5.1.0",
  "python-dotenv>=1.0.1",
  "typer>=0.16.0",
  "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=0.24.0",
  "pytest-timeout>=2.3.0",
]

[project.scripts]
# Two names, one entry point. The long one matches the package, so a machine
# that installed this from a wheel gets the name it expects; `sypy` is the one
# anyone actually types more than once.
sortyourpaperya = "sortyourpaperya.cli:main"
sypy = "sortyourpaperya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sortyourpaperya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# No test may wedge the machine. Several tests drive the watcher, whose loop
# only stays interruptible because every branch awaits; a change that removes
# one spins at full CPU, and `asyncio.wait_for` cannot preempt a coroutine that
# never yields. SIGALRM can, because it lands between bytecodes.
timeout = 60
timeout_method = "signal"
